<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>Muse Agent Desktop</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">M</div>
    <div>
      <div class="app-name">Muse Agent Desktop</div>
      <div class="app-sub" id="activeInfo">—</div>
    </div>
  </div>
  <div class="header-actions">
    <label class="makefun-toggle" title="Suntikkan rules make.fun ke system prompt">
      <input type="checkbox" id="makefunToggle" />
      <span>Mode make.fun</span>
    </label>
    <button id="workspaceBtn" class="ghost">📁 Workspace</button>
    <span id="workspacePath" class="workspace-path">belum dipilih</span>
    <button id="settingsBtn" class="gold">Settings</button>
  </div>
</header>

<div id="layout">
  <aside id="sidebar">
    <button id="newSessionBtn" class="gold wide">+ Sesi Baru</button>
    <div class="side-title">Sesi Tersimpan</div>
    <div id="sessionList"></div>
  </aside>

  <main id="chatPane">
    <div id="messages"></div>
    <div id="composer">
      <textarea id="input" rows="3" placeholder="Tulis tugas untuk agent… (Enter = kirim, Shift+Enter = baris baru)"></textarea>
      <div class="composer-actions">
        <button id="stopBtn" class="ghost" disabled>■ Stop</button>
        <button id="sendBtn" class="gold">Kirim</button>
      </div>
    </div>
  </main>
</div>

<div id="settingsOverlay" class="hidden">
  <div id="settingsPanel">
    <div class="settings-head">
      <h2>Settings — Provider &amp; API Key</h2>
      <button id="settingsClose" class="ghost">✕</button>
    </div>
    <p class="hint">Key disimpan lokal di folder data aplikasi di komputer ini, dan hanya dikirim ke endpoint provider-nya sendiri. Pilih satu provider aktif; model kustom (opsional) menimpa pilihan dropdown.</p>
    <div id="providerForms"></div>
    <div class="settings-foot">
      <button id="settingsSave" class="gold">Simpan Settings</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
